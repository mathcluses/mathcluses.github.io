<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exercices de mathématiques</title>
<!--
  CATALOGUE DES EXERCICES
  Cette page ne contient aucun exercice : elle lit la liste dans « exercices.js » (même dossier)
  et construit les cartes et les filtres. Pour ajouter un exercice, modifier uniquement exercices.js.
-->
<style>
/* COULEURS : mêmes variables que les exerciseurs (thème clair, puis thème sombre automatique). */
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef3fb;--grid:#cfdcf0;--paper:#fdfdff;--ink:#1b2a6b;--muted:#56628f;--line:#b9c6e6;
  --ko:#a3262a;--ko-bg:#fbe6e6;--btn:#1b2a6b;--btn-text:#fff;--accent:#d9534f;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12151f;--grid:#1d2335;--paper:#181c29;--ink:#d6defc;--muted:#98a3cc;--line:#37405f;
  --ko:#ff9a9d;--ko-bg:#381a1c;--btn:#d6defc;--btn-text:#12151f;color-scheme:dark}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--ink);background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;line-height:1.5}
main{max-width:60rem;margin:0 auto;padding:1.5rem 1rem 3rem}
h1{font-size:clamp(1.6rem,5vw,2.2rem);margin:0 0 .3rem;line-height:1.2}
.muted{color:var(--muted);margin:0}
.hide{display:none!important}

/* Filtres */
.filtres{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:.4rem 1rem .9rem;margin:1.2rem 0 .8rem}
.fgrp{margin-top:.6rem}
.flab{display:block;font-weight:700;margin-bottom:.3rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{font:inherit;padding:.3rem .8rem;border-radius:6px;cursor:pointer;border:2px solid var(--line);background:transparent;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:var(--btn-text)}
.chip .n{font-size:.85em;margin-left:.35rem;opacity:.75}
.chip.zero{opacity:.55}
a:focus-visible,button:focus-visible{outline:3px solid #4a7bdc;outline-offset:2px}

/* Liste d'exercices : une carte par exercice, la carte entière est un lien */
#compte{margin:.2rem 0 .8rem}
.liste{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:.9rem}
.carte{display:flex;flex-direction:column;gap:.5rem;height:100%;padding:1rem 1.1rem 1.1rem;background:var(--paper);
  border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;color:inherit;text-decoration:none}
.carte:hover{border-color:var(--ink);border-left-color:var(--accent)}
.carte h2{font-size:1.15rem;margin:0;line-height:1.3}
.carte p{margin:0;color:var(--muted)}
.carte .fmt{font-size:.88rem}
.tags{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:auto;padding-top:.3rem}
.tag{font-size:.82rem;padding:.05rem .5rem;border-radius:4px;border:1px solid var(--line)}
.tag.niv{font-weight:700}
.tag.brouillon{border-style:dashed;color:var(--ko)}
.vide{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:1rem}
.vide button{font:inherit;margin-left:.5rem;padding:.3rem .8rem;border-radius:6px;cursor:pointer;border:2px solid var(--btn);background:var(--btn);color:var(--btn-text)}

/* Messages d'erreur du fichier exercices.js */
.alertes{background:var(--ko-bg);color:var(--ko);border-radius:6px;padding:.7rem .9rem 1rem;margin:1rem 0}
.alertes strong{display:block;margin-bottom:.3rem}
.alertes ul{margin:0;padding-left:1.2rem}
</style>
</head>
<body>
<main>
  <header>
    <h1 id="titre">Exercices de mathématiques</h1>
    <p class="muted" id="intro"></p>
  </header>

  <div id="alertes" class="alertes hide" role="alert"></div>

  <noscript><p class="vide">Cette page a besoin de JavaScript pour afficher la liste des exercices.</p></noscript>

  <section class="filtres" id="filtres" aria-label="Filtres">
    <div class="fgrp" role="group" aria-labelledby="lniv"><span class="flab" id="lniv">Niveau</span><div class="chips" id="cniv"></div></div>
    <div class="fgrp" role="group" aria-labelledby="lthe"><span class="flab" id="lthe">Thème</span><div class="chips" id="cthe"></div></div>
  </section>

  <p class="muted" id="compte" aria-live="polite"></p>
  <ul class="liste" id="liste"></ul>
  <p class="vide hide" id="vide"><span id="videtxt"></span><button type="button" id="raz">Tout afficher</button></p>
</main>

<!-- Les données : un fichier à part, facile à modifier (voir le mode d'emploi dans LISEZ-MOI.txt) -->
<script src="exercices.js"></script>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var S=window.SITE||{};
  var NIV=Array.isArray(S.niveaux)?S.niveaux:[], THE=Array.isArray(S.themes)?S.themes:[];
  var params=new URLSearchParams(location.search);
  var voirBrouillons=params.has("brouillons");   // adresse?brouillons : affiche aussi les exercices masqués
  var erreurs=[], items=[];

  document.title=S.titre||"Exercices de mathématiques";
  $("titre").textContent=S.titre||"Exercices de mathématiques";
  if(S.intro)$("intro").textContent=S.intro;

  // ===== 1. VÉRIFICATION DU FICHIER DE DONNÉES =====
  // Les problèmes sont listés dans un cadre rouge en haut de la page ; les exercices corrects restent affichés.
  var txt=function(x){return typeof x==="string"&&x.trim()!==""};
  var liste=function(x){return Array.isArray(x)&&x.length>0&&x.every(txt)};

  if(!Array.isArray(window.EXERCICES)){
    erreurs.push("Le fichier « exercices.js » est introuvable ou contient une erreur de syntaxe (virgule, guillemet ou crochet oublié ?). Ouvrir la console du navigateur (touche F12) indique la ligne fautive.");
  }else{
    var vus={};
    window.EXERCICES.forEach(function(e,i){
      var nom="Exercice n°"+(i+1)+(e&&txt(e.titre)?" (« "+e.titre+" »)":"");
      var pb=[];
      if(!e||typeof e!=="object"){erreurs.push(nom+" : entrée invalide.");return}
      if(!txt(e.titre))pb.push("« titre » manquant");
      if(!txt(e.url))pb.push("« url » manquante");
      else if(vus[e.url])pb.push("« url » déjà utilisée par l’exercice n°"+vus[e.url]);
      else vus[e.url]=i+1;
      [["niveaux",NIV],["themes",THE]].forEach(function(c){
        var champ=c[0],ref=c[1];
        if(!liste(e[champ])){pb.push("« "+champ+" » doit être une liste non vide, par exemple [\"4e\"]");return}
        e[champ].forEach(function(v){if(ref.indexOf(v)<0)pb.push("« "+v+" » n’est pas déclaré dans SITE."+champ)});
      });
      if(pb.length)erreurs.push(nom+" : "+pb.join(" ; ")+".");
      if(txt(e.titre)&&txt(e.url)&&liste(e.niveaux)&&liste(e.themes))items.push(e);
    });
  }
  if(erreurs.length){
    var box=$("alertes");
    var st=document.createElement("strong");st.textContent="Problème dans la liste des exercices (exercices.js) :";
    var ul=document.createElement("ul");
    erreurs.forEach(function(m){var li=document.createElement("li");li.textContent=m;ul.appendChild(li)});
    box.appendChild(st);box.appendChild(ul);box.className="alertes";
  }

  var visibles=items.filter(function(e){return !e.brouillon||voirBrouillons});

  // ===== 2. FILTRES =====
  // sel : filtre choisi pour chaque champ ("" = tous). Un exercice est affiché s'il porte le niveau ET le thème choisis.
  var sel={niveaux:"",themes:""};
  var CHAMPS=[{champ:"niveaux",ordre:NIV,zone:"cniv",param:"niveau",tous:"Tous niveaux"},
              {champ:"themes",ordre:THE,zone:"cthe",param:"theme",tous:"Tous thèmes"}];

  // valeurs réellement utilisées, dans l'ordre déclaré dans exercices.js (les valeurs non déclarées viennent à la fin)
  function utilisees(c){
    var set={};
    visibles.forEach(function(e){e[c.champ].forEach(function(v){set[v]=1})});
    var res=c.ordre.filter(function(v){return set[v]});
    Object.keys(set).forEach(function(v){if(res.indexOf(v)<0)res.push(v)});
    return res;
  }
  CHAMPS.forEach(function(c){
    c.valeurs=utilisees(c);
    var demande=params.get(c.param);                       // filtre partagé par l'adresse : ?niveau=4e&theme=Fractions
    if(demande&&c.valeurs.indexOf(demande)>=0)sel[c.champ]=demande;
  });

  // correspond : l'exercice passe-t-il les filtres (en ignorant éventuellement un champ, pour compter les boutons) ?
  function correspond(e,ignore){
    return CHAMPS.every(function(c){return c.champ===ignore||!sel[c.champ]||e[c.champ].indexOf(sel[c.champ])>=0});
  }

  // Les boutons sont créés une fois ; ensuite on ne met à jour que leur état et leur compteur (le focus clavier est conservé).
  function creerBoutons(c){
    var zone=$(c.zone);
    [""].concat(c.valeurs).forEach(function(v){
      var b=document.createElement("button");
      b.type="button";b.className="chip";b.setAttribute("data-v",v);
      b.appendChild(document.createTextNode(v||c.tous));
      var n=document.createElement("span");n.className="n";b.appendChild(n);
      b.addEventListener("click",function(){sel[c.champ]=v;maj()});
      zone.appendChild(b);
    });
  }
  function majBoutons(c){
    [].forEach.call($(c.zone).children,function(b){
      var v=b.getAttribute("data-v");
      var nb=visibles.filter(function(e){return correspond(e,c.champ)&&(!v||e[c.champ].indexOf(v)>=0)}).length;
      b.setAttribute("aria-pressed",String((sel[c.champ]||"")===v));
      b.lastChild.textContent="("+nb+")";
      b.className="chip"+(nb===0?" zero":"");
    });
  }

  // ===== 3. CARTES =====
  // trier : range des étiquettes selon l'ordre déclaré (les valeurs non déclarées passent à la fin)
  function trier(vals,ordre){
    var rang=function(v){var i=ordre.indexOf(v);return i<0?ordre.length:i};
    return vals.slice().sort(function(a,b){return rang(a)-rang(b)});
  }
  function carte(e){
    var li=document.createElement("li");
    var a=document.createElement("a");a.className="carte";a.href=e.url;
    var h=document.createElement("h2");h.textContent=e.titre;a.appendChild(h);
    // La carte n’affiche que le titre (la description, le format, les niveaux et les thèmes servent aux filtres et restent dans exercices.js).
    var tags=document.createElement("div");tags.className="tags";
    if(e.brouillon){var s=document.createElement("span");s.className="tag brouillon";s.textContent="Brouillon";tags.appendChild(s)}
    if(e.brouillon)a.appendChild(tags);
    li.appendChild(a);return li;
  }

  // ===== 4. AFFICHAGE =====
  function majURL(){
    var p=new URLSearchParams();
    CHAMPS.forEach(function(c){if(sel[c.champ])p.set(c.param,sel[c.champ])});
    if(voirBrouillons)p.set("brouillons","1");
    var q=p.toString();
    try{history.replaceState(null,"",location.pathname+(q?"?"+q:""))}catch(err){}  // l'adresse devient partageable
  }
  function maj(){
    CHAMPS.forEach(majBoutons);
    var res=visibles.filter(function(e){return correspond(e)});
    var ul=$("liste");ul.innerHTML="";
    res.forEach(function(e){ul.appendChild(carte(e))});
    var n=res.length,tot=visibles.length;
    $("compte").textContent=tot?(n+" exercice"+(n>1?"s":"")+(n<tot?" sur "+tot:"")):"";
    var vide=$("vide");
    if(n===0){
      $("videtxt").textContent=tot?"Aucun exercice ne correspond à ce niveau et à ce thème.":"Aucun exercice pour le moment.";
      $("raz").className=tot?"":"hide";
      vide.className="vide";
    }else vide.className="vide hide";
    $("filtres").className=tot?"filtres":"filtres hide";
    majURL();
  }
  $("raz").addEventListener("click",function(){sel.niveaux="";sel.themes="";maj()});

  CHAMPS.forEach(creerBoutons);
  maj();
})();
</script>
</body>
</html>
