<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>6e · Questions flash : Multiples et diviseurs</title>
<link rel="stylesheet" href="../commun/flash.css">
</head>
<body>
<!--
  QUESTIONS FLASH 6e : MULTIPLES ET DIVISEURS
  Parties : vocabulaire (multiple, diviseur, divisible), trouver un multiple / un diviseur,
  critères de divisibilité par 2, 3, 5, 9, 10, liste des diviseurs.
  Titre : « Permis diviseurs » (2 tests du chapitre d'affilée à 17 / 20 ou plus).
  Mode d'emploi : voir ../6qf-fractions/index.html.
-->
<main id="flash"></main>
<script src="../commun/flash.js"></script>
<script src="../commun/domaines.js"></script>
<script src="../commun/nombres.js"></script>
<script>
(function(){
  var O=FLASH.outils, N=NOMBRES, nb=O.nb;
  function diviseurs(n){var l=[];for(var d=1;d<=n;d++)if(n%d===0)l.push(d);return l}
  function sommeChiffres(n){return String(n).split("").reduce(function(a,c){return a+Number(c)},0)}

  // ---------- Vocabulaire ----------
  var VOCABULAIRE={ nom:"Multiple, diviseur, divisible", gen:function(h){
    var a=h.rnd(3,9),b=h.rnd(3,12),c=a*b;
    var bonnes=[c+" est un multiple de "+a,a+" est un diviseur de "+c,c+" est divisible par "+a,a+" divise "+c];
    var fausses=[a+" est un multiple de "+c,c+" est un diviseur de "+a,a+" est divisible par "+c,c+" divise "+a,
                 c+" est un multiple de "+(a+1),(a+1)+" est un diviseur de "+c].filter(function(t){
                   var m=t.match(/(\d+) est un multiple de (\d+)|(\d+) est un diviseur de (\d+)|(\d+) est divisible par (\d+)|(\d+) divise (\d+)/);
                   var x,y;if(m[1]){x=+m[1];y=+m[2]}else if(m[3]){x=+m[4];y=+m[3]}else if(m[5]){x=+m[5];y=+m[6]}else{x=+m[8];y=+m[7]}
                   return x%y!==0;                       // on ne garde que les phrases vraiment fausses
                 });
    var bonne=h.choix(bonnes);
    return {q:c+" = "+a+" × "+b+". Quelle phrase est juste ?",large:true,choix:N.propositions(h,[bonne,0],fausses.map(function(t,i){return [t,i+1]}),false,false,6),r:bonne,
            correction:c+" est dans la table de "+a+" : "+c+" est un multiple de "+a+", et "+a+" est un diviseur de "+c+" ("+c+" est divisible par "+a+")."};
  }};
  var TROUVER_MULTIPLE={ nom:"Trouver un multiple", gen:function(h){
    var a=h.rnd(3,12),k=h.rnd(3,12),bonne=a*k,f=[];
    [1,2,-1,-2,a+1,a-1].forEach(function(d){var x=bonne+d;if(x>0&&x%a)f.push(x)});
    for(var i=0;i<6;i++){var y=a*h.rnd(2,12)+h.rnd(1,a-1);f.push(y)}
    return {q:"Quel nombre est un <b>multiple</b> de "+a+" ?",choix:N.propositions(h,[nb(bonne),bonne],f.map(function(x){return [nb(x),x]}),true),r:nb(bonne),
            correction:bonne+" = "+a+" × "+k+" : c’est un multiple de "+a+"."};
  }};
  var TROUVER_DIVISEUR={ nom:"Trouver un diviseur", gen:function(h){
    var n=h.choix([12,18,20,24,28,30,36,40,42,45,48,50,54,56,60,63,64,72,75,80,84,90,96,100]);
    var d=diviseurs(n).filter(function(x){return x>1&&x<n}),bonne=h.choix(d),f=[];
    for(var x=2;x<=15;x++)if(n%x)f.push(x);
    return {q:"Quel nombre est un <b>diviseur</b> de "+n+" ?",choix:N.propositions(h,[String(bonne),bonne],f.map(function(x){return [String(x),x]}),true),r:String(bonne),
            correction:n+" = "+bonne+" × "+(n/bonne)+" : "+bonne+" est un diviseur de "+n+"."};
  }};
  var MULTIPLE_SUIVANT={ nom:"Multiple le plus proche", gen:function(h){
    var a=h.rnd(4,12),x=h.rnd(30,120),apres=h.choix([true,false]);
    if(x%a===0)x++;
    var r=apres?Math.ceil(x/a)*a:Math.floor(x/a)*a;
    return {q:"Quel est le multiple de "+a+" le plus proche de "+x+", "+(apres?"juste au-dessus":"juste en dessous")+" ?",r:r,
            pieges:[apres?r-a:r+a,x+1,x-1,apres?r+1:r-1,r+a*(apres?1:-1)],
            correction:a+" × "+(r/a)+" = "+r+(apres?" est le premier multiple de "+a+" après "+x+".":" est le dernier multiple de "+a+" avant "+x+".")};
  }};

  // ---------- Critères de divisibilité ----------
  var CRITERES={2:"son chiffre des unités est 0, 2, 4, 6 ou 8",5:"son chiffre des unités est 0 ou 5",10:"son chiffre des unités est 0",
                3:"la somme de ses chiffres est divisible par 3",9:"la somme de ses chiffres est divisible par 9"};
  var DIVISIBLE={ nom:"Critères de divisibilité", gen:function(h){
    var d=h.choix([2,5,10,3,3,9,9]),bonne,f=[],essais=0;
    do{bonne=h.rnd(100,9999)}while(bonne%d);
    while(f.length<10&&essais++<500){
      var x=h.rnd(100,9999);
      if(d===3||d===9){if(x%d&&(d===3||sommeChiffres(x)%3===0||h.rnd(0,1)))f.push(x)}   // pour 9 : des multiples de 3 qui ne sont pas multiples de 9
      else if(x%d&&(d===10?x%5===0||h.rnd(0,1):1))f.push(x);
    }
    return {q:"Quel nombre est <b>divisible par "+d+"</b> ?",choix:N.propositions(h,[nb(bonne),bonne],f.map(function(x){return [nb(x),x]})),r:nb(bonne),
            correction:"Un nombre est divisible par "+d+" si "+CRITERES[d]+"."+(d===3||d===9?" Ici : "+String(bonne).split("").join(" + ")+" = "+sommeChiffres(bonne)+".":"")};
  }};
  var PAR_QUOI={ nom:"Divisible par 3 ou par 9 ?", gen:function(h){
    var n,cas=h.rnd(1,3);
    do{n=h.rnd(100,9999)}while(cas===1?n%9!==0:cas===2?(n%3!==0||n%9===0):n%3===0);
    var r=cas===1?"par 3 et par 9":cas===2?"par 3, pas par 9":"ni par 3, ni par 9";
    return {q:"Le nombre "+nb(n)+" est divisible…",large:true,choix:["par 3 et par 9","par 3, pas par 9","par 9, pas par 3","ni par 3, ni par 9"],r:r,
            correction:"Somme des chiffres : "+String(n).split("").join(" + ")+" = "+sommeChiffres(n)+". "+(cas===3?"Ce n’est pas un multiple de 3.":cas===2?"C’est un multiple de 3 mais pas de 9.":"C’est un multiple de 9 (donc aussi de 3).")};
  }};

  // ---------- Liste des diviseurs ----------
  var LISTE={ nom:"Liste des diviseurs", gen:function(h){
    var n=h.choix([6,8,10,12,14,15,16,18,20,21,24,28,30,32,36]),d=diviseurs(n),bonne=d.join(" ; ");
    var f=[d.slice(1).join(" ; "),d.slice(0,-1).join(" ; "),d.filter(function(x,i){return i!==Math.floor(d.length/2)}).join(" ; "),
           d.concat([n*2]).join(" ; "),[n,2*n,3*n,4*n].join(" ; ")];
    for(var x=2;x<n;x++)if(n%x){f.push(d.concat([x]).sort(function(a,b){return a-b}).join(" ; "));if(f.length>8)break}
    return {q:"Quels sont <b>tous</b> les diviseurs de "+n+" ?",large:true,choix:N.propositions(h,[bonne,0],f.map(function(t,i){return [t,i+1]}),false,false,6),r:bonne,
            correction:"On cherche les produits égaux à "+n+" : "+d.filter(function(x){return x*x<=n}).map(function(x){return x+" × "+(n/x)}).join(", ")+". Diviseurs : "+bonne+"."};
  }};

  FLASH.chapitre({
    titre: "Multiples et diviseurs",
    image: '<span class="ill-dec">7 × 8</span>',
    nbQuestions: 10,
    nbTest: 20,
    titres: [{ nom:"Permis diviseurs", medaille:["PERMIS","DIVISEURS","÷"],
      serie:{partie:"Test : tout le chapitre",fois:2,minimum:17},
      condition:"Réussis le test du chapitre (20 questions) 2 fois d’affilée :", bravo:"Tu maîtrises multiples et diviseurs.", tampon:"Validé" }],
    sections: [
      { groupe:"Multiples et diviseurs", nom:"Le vocabulaire", image:'<span class="ill-dec">a × b</span>', types:[VOCABULAIRE] },
      { groupe:"Multiples et diviseurs", nom:"Trouver un multiple, un diviseur", affiche:"Trouver un multiple, un diviseur",
        image:'<span class="ill-dec">7, 14, 21</span>', types:[TROUVER_MULTIPLE,TROUVER_DIVISEUR,MULTIPLE_SUIVANT] },
      { groupe:"Divisibilité", nom:"Critères de divisibilité", image:'<span class="ill-dec">÷ 2, 3, 5, 9</span>', types:[DIVISIBLE,DIVISIBLE,PAR_QUOI] },
      { groupe:"Divisibilité", nom:"Liste des diviseurs", image:'<span class="ill-dec">1 ; 2 ; 3 ; 6</span>', types:[LISTE] }
    ]
  });
})();
</script>
</body>
</html>
