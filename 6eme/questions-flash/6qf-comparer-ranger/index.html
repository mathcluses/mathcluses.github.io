<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>6e · Questions flash : Comparer, ranger, encadrer</title>
<link rel="stylesheet" href="../commun/flash.css">
</head>
<body>
<!--
  QUESTIONS FLASH 6e : COMPARER, RANGER, ENCADRER (nombres entiers et décimaux)
  Parties : comparer, ranger, encadrer (entre deux entiers, au dixième, à la dizaine…), intercaler, arrondir.
  Titre : « Permis comparer » (2 tests du chapitre d'affilée à 17 / 20 ou plus).
  Outils communs : ../commun/nombres.js. Mode d'emploi : voir ../6qf-fractions/index.html.
-->
<main id="flash"></main>
<script src="../commun/flash.js"></script>
<script src="../commun/domaines.js"></script>
<script src="../commun/nombres.js"></script>
<script>
(function(){
  var O=FLASH.outils, N=NOMBRES, nb=O.nb, A=N.arrondi, ch=N.ch, V=N.valeur;

  // ---------- Comparer ----------
  var COMPARER={ nom:"Comparer deux nombres", gen:function(h){
    var e=String(h.rnd(0,40)),x=h.rnd(2,9),y=h.rnd(1,x-1),z=ch(h,true),a,b,expl;
    switch(h.rnd(1,5)){
      case 1: a=e+","+x;b=e+","+y+z;expl="Même partie entière : on compare les dixièmes ("+x+" et "+y+"). Le nombre de chiffres ne compte pas !";break;
      case 2: a=e+","+x;b=e+","+x+"0";expl="Un zéro à la fin de la partie décimale ne change rien.";break;
      case 3: var e2=Number(e)+h.rnd(1,9);a=e2+","+y;b=e+","+x+z+ch(h,true);expl="On compare d’abord les parties entières : "+e2+" et "+e+".";break;
      case 4: a=String(Number(e)+1);b=e+",9"+(h.choix(["","9","99"]))+z;expl="La partie entière de "+b+" est "+e+" : il est plus petit que "+a+".";break;
      default: a=e+",0"+x;b=e+","+y;expl="On compare les dixièmes : 0 et "+y+".";
    }
    if(h.choix([true,false])){var t=a;a=b;b=t}
    var r=V(a)<V(b)?"&lt;":V(a)>V(b)?"&gt;":"=";
    return {q:"Complète avec &lt;, = ou &gt; : "+O.nw(a+" … "+b),choix:["&lt;","=","&gt;"],r:r,correction:a+" "+r+" "+b+". "+expl};
  }};

  // ---------- Ranger ----------
  // 4 ou 5 nombres qui se ressemblent : même partie entière (souvent), chiffres échangés, zéros
  function famille(h,combien){
    var e=h.rnd(0,30),a=ch(h,true),b;do{b=ch(h,true)}while(b===a);
    var l=h.melange([a,b,a+b,b+a,"0"+a,a+"0"+b,b+"0"+a,"0"+b]).slice(0,combien).map(function(d){return V(e+","+d)});
    if(h.choix([true,false]))l[0]=e+1;               // parfois un entier, ou une autre partie entière
    if(h.choix([true,false]))l[1]=A(e+(Number(a)+Number(b))/10);
    var vus={};return l.filter(function(x){if(vus[x])return false;vus[x]=1;return true});
  }
  var RANGER={ nom:"Ranger dans l’ordre", gen:function(h){
    var l;do{l=famille(h,4)}while(l.length<4);
    var croissant=h.choix([true,false]),signe=croissant?" &lt; ":" &gt; ";
    var tri=function(x){return x.slice().sort(function(a,b){return croissant?a-b:b-a})},ecr=function(x){return x.map(nb).join(signe)};
    var bonne=ecr(tri(l)),choix=[bonne],vus={};vus[bonne]=1;
    // erreurs typiques : à l'envers, et « le plus de chiffres = le plus grand »
    var essais=[tri(l).reverse(),l.slice().sort(function(a,b){var d=nb(a).length-nb(b).length;return (croissant?1:-1)*(d||a-b)})];
    for(var i=0;i<40;i++)essais.push(h.melange(l));
    essais.forEach(function(x){var t=ecr(x);if(!vus[t]&&choix.length<6){vus[t]=1;choix.push(t)}});
    return {q:"Range dans l’ordre <b>"+(croissant?"croissant":"décroissant")+"</b> : "+h.melange(l).map(nb).join(" ; "),large:true,choix:h.melange(choix),r:bonne,
            correction:(croissant?"Du plus petit au plus grand":"Du plus grand au plus petit")+" : "+bonne+"."};
  }};
  var EXTREME={ nom:"Le plus grand, le plus petit", gen:function(h){
    var l;do{l=famille(h,h.rnd(6,7))}while(l.length<6);
    var grand=h.choix([true,false]),r=grand?Math.max.apply(null,l):Math.min.apply(null,l);
    return {q:"Quel est le plus <b>"+(grand?"grand":"petit")+"</b> de ces nombres ?",choix:h.melange(l).map(nb),r:nb(r),
            correction:"On compare les parties entières, puis les dixièmes, les centièmes… Le plus "+(grand?"grand":"petit")+" : "+nb(r)+"."};
  }};

  // ---------- Encadrer ----------
  function enc(a,b){return nb(a)+" et "+nb(b)}
  var ENCADRER={ nom:"Encadrer", gen:function(h){
    var cas=h.rnd(1,3),x,pas,mots;
    if(cas===1){x=N.nombre(h,h.rnd(1,2),h.rnd(1,2)).v;pas=1;mots="deux nombres entiers consécutifs"}
    else if(cas===2){x=N.nombre(h,h.rnd(1,2),2).v;pas=.1;mots="deux nombres consécutifs au dixième (un chiffre après la virgule)"}
    else{x=N.nombre(h,h.rnd(3,4),0).v;pas=h.choix([10,100,1000].filter(function(p){return p<x}));mots="deux multiples consécutifs de "+nb(pas)}
    var bas=A(Math.floor(A(x/pas))*pas),haut=A(bas+pas);
    var f=[[bas-pas,bas],[haut,haut+pas],[A(bas-pas),haut],[A(bas/10),A(haut/10)],[A(bas*10),A(haut*10)],[A(x-pas),A(x+pas)],[bas,A(bas+2*pas)]]
      .filter(function(p){return p[0]>=0}).map(function(p,i){return [enc(A(p[0]),A(p[1])),i+1]});
    return {q:"Encadre "+O.nw(nb(x))+" entre "+mots+" : "+O.nw("… &lt; "+nb(x)+" &lt; …"),large:true,choix:N.propositions(h,[enc(bas,haut),0],f,false,false,6),r:enc(bas,haut),
            correction:nb(bas)+" &lt; "+nb(x)+" &lt; "+nb(haut)+"."};
  }};
  var INTERCALER={ nom:"Intercaler un nombre", gen:function(h){
    var e=h.rnd(0,20),t=h.rnd(0,8),d=h.rnd(1,9),entre1=h.choix([true,false]);
    var bas=entre1?e:A(e+t/10),haut=entre1?e+1:A(bas+.1),bonne=entre1?nb(A(e+d/10+t/100)):nb(A(bas+d/100));
    var f=[nb(A(haut+d/100)),nb(bas),nb(haut),nb(A(bas-.01*d)),nb(e+1+(entre1?1:0)),nb(A(e*10+t)),nb(A(bas+1+d/100)),nb(A(haut+.1))]
      .filter(function(x){var v=V(x);return !(v>bas&&v<haut)}).map(function(x){return [x,V(x)]});
    return {q:"Quel nombre est compris entre "+nb(bas)+" et "+nb(haut)+" ?",choix:N.propositions(h,[bonne,V(bonne)],f),r:bonne,
            correction:"Il y a toujours un nombre entre deux décimaux : "+nb(bas)+" &lt; "+bonne+" &lt; "+nb(haut)+"."};
  }};

  // ---------- Arrondir ----------
  var ARRONDIR={ nom:"Arrondir", gen:function(h){
    var cas=h.rnd(1,4),x,p,mot;
    if(cas===1){x=N.nombre(h,h.rnd(1,2),h.rnd(1,2)).v;p=1;mot="à l’unité"}
    else if(cas===2){x=N.nombre(h,h.rnd(1,2),h.rnd(2,3)).v;p=.1;mot="au dixième"}
    else if(cas===3){x=N.nombre(h,1,3).v;p=.01;mot="au centième"}
    else{x=N.nombre(h,h.rnd(3,4),0).v;p=h.choix([10,100]);mot=p===10?"à la dizaine":"à la centaine"}
    var r=A(Math.round(A(x/p))*p),tr=A(Math.floor(A(x/p))*p),au=r===tr?A(tr+p):tr;
    return {q:"Arrondi "+mot+" de "+O.nw(nb(x))+" ?",r:r,pieges:[au,A(Math.round(x/(p*10))*p*10),A(Math.round(x/(p/10))*p/10)],
            correction:"On regarde le chiffre juste après : 5 ou plus → on arrondit au-dessus, sinon au-dessous. "+nb(tr)+" &lt; "+nb(x)+" &lt; "+nb(A(tr+p))+" ; arrondi : "+nb(r)+"."};
  }};

  FLASH.chapitre({
    titre: "Comparer, ranger, encadrer",
    image: '<span class="ill-dec">3,5 &gt; 3,45</span>',
    nbQuestions: 10,
    nbTest: 20,
    titres: [{ nom:"Permis comparer", medaille:["PERMIS","COMPARER","&lt;"],
      serie:{partie:"Test : tout le chapitre",fois:2,minimum:17},
      condition:"Réussis le test du chapitre (20 questions) 2 fois d’affilée :", bravo:"Tu sais comparer, ranger et encadrer.", tampon:"Validé" }],
    sections: [
      { groupe:"Comparer et ranger", nom:"Comparer", image:'<span class="ill-dec">3,5 &gt; 3,45</span>', types:[COMPARER] },
      { groupe:"Comparer et ranger", nom:"Ranger", image:'<span class="ill-dec">1 &lt; 2 &lt; 3</span>', types:[RANGER,RANGER,EXTREME] },
      { groupe:"Encadrer et arrondir", nom:"Encadrer", image:'<span class="ill-dec">7 &lt; 7,4 &lt; 8</span>', types:[ENCADRER] },
      { groupe:"Encadrer et arrondir", nom:"Intercaler", image:'<span class="ill-dec">3,4 &lt; … &lt; 3,5</span>', types:[INTERCALER] },
      { groupe:"Encadrer et arrondir", nom:"Arrondir", image:'<span class="ill-dec">7,46 ≈ 7,5</span>', types:[ARRONDIR] }
    ]
  });
})();
</script>
</body>
</html>
